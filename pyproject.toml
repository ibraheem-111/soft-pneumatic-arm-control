[project]
name = "ras556-project"
version = "0.1.0"
description = "Modeling and controller design for a pneumatically actuated soft robotic arm (RAS556)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.18.1",
    "soft-robotic-arm>=0.4.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/softarm"]
